<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:">
<title>누리글</title>
<link rel="stylesheet" href="style.css">
<style id="page-style"></style>
</head>
<body>
<div id="app">
  <nav id="menubar" class="no-print"></nav>
  <div id="toolbar" class="toolbar no-print"></div>
  <div id="formatbar" class="toolbar no-print"></div>
  <div id="docarea">
    <div id="ruler-corner" class="no-print"></div>
    <canvas id="ruler-h" class="no-print" aria-label="가로 눈금자"></canvas>
    <canvas id="ruler-v" class="no-print" aria-label="세로 눈금자"></canvas>
    <div id="panes">
    <main id="workspace">
      <div id="zoomer">
        <div id="page" class="page">
          <div id="page-guides" class="no-print" aria-hidden="true"></div>
          <div id="editor" contenteditable="true" spellcheck="false"></div>
          <div id="marks" class="no-print" aria-hidden="true"></div>
          <div id="mcarets" class="no-print" aria-hidden="true"></div>
          <div id="overlay" class="no-print" aria-hidden="true"></div>
        </div>
      </div>
    </main>
    <section id="viewpane" class="no-print" hidden>
      <div class="vp-head"><span class="vp-title"></span><select class="vp-sel" title="이 창에 보일 문서"></select><span class="vp-hint">누르면 이 문서를 편집합니다</span><button class="vp-close" type="button" title="창 나누기 해제">×</button></div>
      <div class="vp-body"><div class="vp-zoom"><div class="page vp-page"><div class="static-ed"></div></div></div></div>
    </section>
    </div>
  </div>
  <div id="doctabs" class="no-print"></div>
  <footer id="statusbar" class="no-print">
    <span id="st-page">1/1쪽</span>
    <span id="st-pos">1단 1줄 1칸</span>
    <span id="st-count">글자 0</span>
    <span id="st-mode" title="Insert 키로 전환">삽입</span>
    <span id="st-block"></span>
    <span id="st-chord"></span>
    <span id="st-macro"></span>
    <span class="spacer"></span>
    <span id="st-msg"></span>
    <label class="zoom"><button id="zoom-out" title="축소">−</button><input id="zoom-range" type="range" min="30" max="300" step="10" value="100"><button id="zoom-in" title="확대">+</button><span id="zoom-val">100%</span></label>
  </footer>
</div>
<div id="menu-popups" class="no-print"></div>
<div id="dialogs" class="no-print"></div>
<div id="ctxmenu" class="menu-popup no-print" hidden></div>
<input type="color" id="color-input" class="hidden-input">
<button id="key-sink" class="hidden-input" tabindex="-1" aria-hidden="true"></button>
<script src="lib/jszip.min.js"></script>
<script src="lib/hwp-parser.js"></script>
<script src="lib/docx.iife.js"></script>
<script src="icons.js"></script>
<script src="hwpx-template.js"></script>
<script src="i18n.js"></script>
<script src="util.js"></script>
<script src="history.js"></script>
<script src="format.js"></script>
<script src="table.js"></script>
<script src="image.js"></script>
<script src="shapes.js"></script>
<script src="look.js"></script>
<script src="cols.js"></script>
<script src="pagenum.js"></script>
<script src="hf.js"></script>
<script src="tabstops.js"></script>
<script src="model.js"></script>
<script src="hwpx.js"></script>
<script src="hwp5.js"></script>
<script src="docx-export.js"></script>
<script src="dialogs.js"></script>
<script src="macro.js"></script>
<script src="mailmerge.js"></script>
<script src="lists.js"></script>
<script src="markdown.js"></script>
<script src="commands.js"></script>
<script src="multisel.js"></script>
<script src="colblock.js"></script>
<script src="ratio.js"></script>
<script src="justify.js"></script>
<script src="ruler.js"></script>
<script src="tabs.js"></script>
<script src="split.js"></script>
<script src="app.js"></script>
</body>
</html>
